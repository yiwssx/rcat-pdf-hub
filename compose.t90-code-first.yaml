# RCAT Production: opt-in source-code-first T90 exposure.
# This overlay does not run native codecs, URL fetcher, or move release gates.
# Use only with docker-compose.yml + docker-compose.prod.yml on the approved
# institutional OIDC-only RCAT host. Never include on an anonymous deployment.
# ALL settings are static booleans; no secrets or Caddy/DNS changes.
x-t90-code-flags: &t90-code-flags
  PDFHUB_T90_CODE_ROLLOUT_ENABLED: "true"
  PDFHUB_TO_PDF_TOOLS_ENABLED: "true"
  PDFHUB_FROM_PDF_TOOLS_ENABLED: "true"
  PDFHUB_MULTI_OUTPUT_ARTIFACTS_ENABLED: "true"
  PDFHUB_SPLIT_ZIP_TOOLS_ENABLED: "true"
  PDFHUB_EXTRACT_PAGES_TOOLS_ENABLED: "true"
  PDFHUB_EXTRACT_EMBEDDED_IMAGES_TOOLS_ENABLED: "true"
  PDFHUB_GRAYSCALE_PDF_TOOLS_ENABLED: "true"
  PDFHUB_HEADER_FOOTER_TOOLS_ENABLED: "true"
  PDFHUB_DOCUMENT_DATA_TOOLS_ENABLED: "true"
  PDFHUB_GEOMETRY_TOOLS_ENABLED: "true"
  PDFHUB_PDF_FILLER_TOOLS_ENABLED: "true"
  PDFHUB_MANAGE_PAGE_TOOLS_ENABLED: "true"
  PDFHUB_PDF_TEXT_OVERLAY_TOOLS_ENABLED: "true"
  PDFHUB_PDF_IMAGE_OVERLAY_TOOLS_ENABLED: "true"
  PDFHUB_PDF_IMAGE_WATERMARK_TOOLS_ENABLED: "true"
  PDFHUB_PDF_REPAIR_STRUCTURE_TOOLS_ENABLED: "true"
  PDFHUB_PDF_EXTRACTIVE_ASSIST_TOOLS_ENABLED: "true"
  PDFHUB_PDF_EDIT_TEXT_TOOLS_ENABLED: "true"
  PDFHUB_PDF_TRANSLATION_TOOLS_ENABLED: "true"
  PDFHUB_PDF_MARKUP_TOOLS_ENABLED: "true"
  PDFHUB_PDF_FLATTEN_VISUAL_TOOLS_ENABLED: "true"
  PDFHUB_T90_PRIVATE_PILOT_ENABLED: "true"
# Source-MAC is not a host codec install or licence/security certification.
# Restricted/credential-bearing capabilities stay OFF in this code-first pass.
  PDFHUB_UNLOCK_PDF_TOOLS_ENABLED: "false"
  PDFHUB_PROTECT_PDF_TOOLS_ENABLED: "false"
  PDFHUB_CHM_NATIVE_DEV_ENABLED: "false"
  PDFHUB_HEIF_NATIVE_DEV_ENABLED: "false"
  PDFHUB_URL_TO_PDF_DEV_ENABLED: "false"
  PDFHUB_WPS_NATIVE_DEV_ENABLED: "false"
  PDFHUB_DWG_NATIVE_DEV_ENABLED: "false"

services:
  api:
    environment: *t90-code-flags
  worker-interactive:
    environment: *t90-code-flags
  worker:
    environment: *t90-code-flags
  worker-heavy:
    environment: *t90-code-flags
  cleanup:
    environment: *t90-code-flags
  webhook:
    environment: *t90-code-flags
  web:
    environment:
      PDFHUB_TO_PDF_TOOLS_ENABLED: "true"
      PDFHUB_FROM_PDF_TOOLS_ENABLED: "true"
      PDFHUB_MULTI_OUTPUT_ARTIFACTS_ENABLED: "true"
      PDFHUB_SPLIT_ZIP_TOOLS_ENABLED: "true"
      PDFHUB_EXTRACT_PAGES_TOOLS_ENABLED: "true"
      PDFHUB_EXTRACT_EMBEDDED_IMAGES_TOOLS_ENABLED: "true"
      PDFHUB_GRAYSCALE_PDF_TOOLS_ENABLED: "true"
      PDFHUB_HEADER_FOOTER_TOOLS_ENABLED: "true"
      PDFHUB_DOCUMENT_DATA_TOOLS_ENABLED: "true"
      PDFHUB_GEOMETRY_TOOLS_ENABLED: "true"
      PDFHUB_PDF_FILLER_TOOLS_ENABLED: "true"
      PDFHUB_MANAGE_PAGE_TOOLS_ENABLED: "true"
      PDFHUB_PDF_TEXT_OVERLAY_TOOLS_ENABLED: "true"
      PDFHUB_PDF_IMAGE_OVERLAY_TOOLS_ENABLED: "true"
      PDFHUB_PDF_IMAGE_WATERMARK_TOOLS_ENABLED: "true"
      PDFHUB_PDF_REPAIR_STRUCTURE_TOOLS_ENABLED: "true"
      PDFHUB_PDF_EXTRACTIVE_ASSIST_TOOLS_ENABLED: "true"
      PDFHUB_PDF_EDIT_TEXT_TOOLS_ENABLED: "true"
      PDFHUB_PDF_TRANSLATION_TOOLS_ENABLED: "true"
      PDFHUB_PDF_MARKUP_TOOLS_ENABLED: "true"
      PDFHUB_PDF_FLATTEN_VISUAL_TOOLS_ENABLED: "true"
      PDFHUB_T90_PRIVATE_PILOT_ENABLED: "true"
      PDFHUB_UNLOCK_PDF_TOOLS_ENABLED: "false"
      PDFHUB_PROTECT_PDF_TOOLS_ENABLED: "false"
      PDFHUB_CHM_NATIVE_DEV_ENABLED: "false"
      PDFHUB_HEIF_NATIVE_DEV_ENABLED: "false"
      PDFHUB_URL_TO_PDF_DEV_ENABLED: "false"
      PDFHUB_WPS_NATIVE_DEV_ENABLED: "false"
      PDFHUB_DWG_NATIVE_DEV_ENABLED: "false"
      PDFHUB_STAGED_TO_PDF_WEB_ENABLED: "true"
      PDFHUB_STAGED_FROM_PDF_WEB_ENABLED: "true"
      PDFHUB_STAGED_MANAGE_WEB_ENABLED: "true"
      PDFHUB_STAGED_TRANSLATION_WEB_ENABLED: "true"
      PDFHUB_STAGED_PDF_ACCESS_WEB_ENABLED: "true"
      PDFHUB_STAGED_DOCUMENT_ASSIST_WEB_ENABLED: "true"
      PDFHUB_STAGED_DOCUMENT_WEB_ENABLED: "true"
      PDFHUB_STAGED_GEOMETRY_WEB_ENABLED: "true"
      PDFHUB_STAGED_PDF_EDIT_WEB_ENABLED: "true"
      PDFHUB_STAGED_M24_FLATTEN_WEB_ENABLED: "true"
      PDFHUB_STAGED_IMAGE_OVERLAY_WEB_ENABLED: "true"
      PDFHUB_STAGED_IMAGE_WATERMARK_WEB_ENABLED: "true"
