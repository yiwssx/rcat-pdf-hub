version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    open-pull-requests-limit: 1
    schedule:
      interval: daily
      time: "03:20"
      timezone: Asia/Bangkok
    allow:
      - dependency-type: direct
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
