version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Bangkok

  - package-ecosystem: npm
    directory: /apps/web
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
      day: monday
      time: "03:20"
      timezone: Asia/Bangkok

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
      day: monday
      time: "03:40"
      timezone: Asia/Bangkok

  - package-ecosystem: docker-compose
    directory: /
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Bangkok

  - package-ecosystem: docker
    directory: /apps/api
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
      day: monday
      time: "04:20"
      timezone: Asia/Bangkok

  - package-ecosystem: docker
    directory: /apps/web
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
      day: monday
      time: "04:40"
      timezone: Asia/Bangkok
