name: Web CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PDFHUB_E2E_SERVER_MODE: production
      - name: T90-1.4c staged document UI opt-in browser acceptance
        run: npx playwright test tests/e2e/t90-1-4c-staged-ui.spec.ts
        env:
          PDFHUB_E2E_SERVER_MODE: production
          PDFHUB_STAGED_DOCUMENT_WEB_ENABLED: "true"
          PDFHUB_DOCUMENT_DATA_TOOLS_ENABLED: "true"
      - name: Capture Candy UI mocked visual baseline
        run: npx playwright test tests/e2e/pdf-hub.smoke.spec.ts --grep "Candy UI baseline capture"
        env:
          PDFHUB_E2E_SERVER_MODE: production
          PDFHUB_UI_CAPTURE: "1"
      - name: Upload Candy UI baseline gallery
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: candy-ui-baseline
          path: apps/web/test-results/candy-ui-baseline/
          retention-days: 14
          if-no-files-found: warn
