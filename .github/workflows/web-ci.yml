name: Web CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build the same multi-stage image used on the Ubuntu RCAT host, not just
  # the Next.js build in a clean CI checkout.
  web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Poison host-only Next dependencies and cache (Docker must ignore them)
        run: |
          mkdir -p apps/web/node_modules/next apps/web/node_modules/@next/swc-linux-x64-musl apps/web/.next/cache
          printf '{"version":"0.0.0-host"}\n' > apps/web/node_modules/next/package.json
          printf '{"version":"0.0.0-host"}\n' > apps/web/node_modules/@next/swc-linux-x64-musl/package.json
          printf 'obsolete host build cache\n' > apps/web/.next/cache/host-cache-marker
          test -f apps/web/.dockerignore
          grep -Fx 'node_modules' apps/web/.dockerignore
          grep -Fx '.next' apps/web/.dockerignore
      - name: Build exact production web container from pinned lockfile
        run: docker build --file apps/web/Dockerfile --tag rcat-pdf-hub-web:ci apps/web

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PDFHUB_E2E_SERVER_MODE: production
      - name: T90-1.4c staging route default-off 404 acceptance
        run: npx playwright test tests/e2e/t90-1-4c-default-off.spec.ts
        env:
          PDFHUB_E2E_SERVER_MODE: production
      - name: T90-1.4c staged document UI opt-in browser acceptance
        run: npx playwright test tests/e2e/t90-1-4c-staged-ui.spec.ts
        env:
          PDFHUB_E2E_SERVER_MODE: production
          PDFHUB_STAGED_DOCUMENT_WEB_ENABLED: "true"
          PDFHUB_DOCUMENT_DATA_TOOLS_ENABLED: "true"
      - name: T90-1.5 staged geometry route default-off 404
        run: npx playwright test tests/e2e/t90-1-5-default-off.spec.ts
        env:
          PDFHUB_E2E_SERVER_MODE: production
      - name: T90-1.5 opt-in geometry browser acceptance
        run: npx playwright test tests/e2e/t90-1-5-staged-ui.spec.ts
        env:
          PDFHUB_E2E_SERVER_MODE: production
          PDFHUB_STAGED_GEOMETRY_WEB_ENABLED: "true"
          PDFHUB_GEOMETRY_TOOLS_ENABLED: "true"
      - name: Capture Candy UI mocked visual baseline
        run: npx playwright test tests/e2e/pdf-hub.smoke.spec.ts --grep "Candy UI baseline capture"
        env:
          PDFHUB_E2E_SERVER_MODE: production
          PDFHUB_UI_CAPTURE: "1"
      - name: Upload Candy UI baseline gallery
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: candy-ui-baseline
          path: apps/web/test-results/candy-ui-baseline/
          retention-days: 14
          if-no-files-found: warn
