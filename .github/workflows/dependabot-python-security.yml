name: Dependabot Python security validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/api/requirements.txt'
      - 'apps/api/requirements.lock'

concurrency:
  group: dependabot-python-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Dependabot head without executing it
        run: |
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/dependabot-security-pr"
          test "$(git rev-parse refs/remotes/origin/dependabot-security-pr)" = "${HEAD_SHA}"

      - name: Verify Python security dependency policy
        run: python3 scripts/check-python-security-dependency.py "${BASE_SHA}" "${HEAD_SHA}"

      - name: Materialize only the verified requirements state
        run: |
          git show "${HEAD_SHA}:apps/api/requirements.txt" > apps/api/requirements.txt
          if git cat-file -e "${HEAD_SHA}:apps/api/requirements.lock" 2>/dev/null; then
            git show "${HEAD_SHA}:apps/api/requirements.lock" > apps/api/requirements.lock
          fi
          git config user.name "dependabot-security-validation"
          git config user.email "dependabot-security-validation@users.noreply.github.com"
          git add apps/api/requirements.txt apps/api/requirements.lock
          git commit -m "test: materialize verified Python security update"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Prepare Valkey kernel precondition
        run: |
          sudo sysctl -w vm.overcommit_memory=1
          test "$(sysctl -n vm.overcommit_memory)" = "1"

      - name: Run full zero-cost validation
        run: |
          validation_log="$(mktemp)"
          if ! make validate-free >"${validation_log}" 2>&1; then
            echo "Full zero-cost validation failed; final output follows:" >&2
            tail -n 160 "${validation_log}" >&2
            exit 1
          fi
          echo "Full zero-cost validation: PASS"

  lock-artifact:
    name: Generate read-only Python dependency lock review artifact
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out exact trusted main base
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable Dependabot head and one direct requirement change
        run: |
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/dependabot-lock-pr"
          test "$(git rev-parse refs/remotes/origin/dependabot-lock-pr)" = "${HEAD_SHA}"
          python3 scripts/check-python-security-dependency.py "${BASE_SHA}" "${HEAD_SHA}"
          git show "${HEAD_SHA}:apps/api/requirements.txt" > apps/api/requirements.txt

      - name: Resolve and hash-lock only verified requirements in pinned Python image
        run: |
          bash scripts/compile-python-lock.sh
          python3 scripts/check-python-lock.py
          # Fail rather than publish an artifact if any unrelated tracked file changed.
          while IFS= read -r path; do
            case "${path}" in
              apps/api/requirements.txt|apps/api/requirements.lock) ;;
              *) echo "Unexpected modified path: ${path}" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          sha256sum apps/api/requirements.txt apps/api/requirements.lock

      - name: Upload review-only full hashed Python lockfile
        uses: actions/upload-artifact@v6
        with:
          name: python-hashed-lock-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: apps/api/requirements.lock
          if-no-files-found: error
          retention-days: 14

  manual-pillow-lock-probe:
    name: Temporary trusted Pillow 13 lock generation (DO NOT MERGE)
    if: github.event.pull_request.user.login == 'yiwssx' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout exact trusted main base
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact one-pin Pillow 13 proposal
        run: |
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/pillow-lock-probe"
          test "$(git rev-parse refs/remotes/origin/pillow-lock-probe)" = "${HEAD_SHA}"
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          names = set(subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines())
          assert names == {'apps/api/requirements.txt', '.github/workflows/dependabot-python-security.yml'}, names
          before = subprocess.check_output(['git','show',base+':apps/api/requirements.txt'],text=True)
          after = subprocess.check_output(['git','show',head+':apps/api/requirements.txt'],text=True)
          assert before.count('Pillow==12.3.0') == 1
          assert after == before.replace('Pillow==12.3.0', 'Pillow==13.0.0'), 'Unreviewed dependency mutation'
          Path('apps/api/requirements.txt').write_text(after)
          print('Trusted exactly one Pillow major pin change: PASS')
          PY
      - name: Generate full Pillow 13 hashed dependency lock in pinned Docker
        run: |
          bash scripts/compile-python-lock.sh
          python3 scripts/check-python-lock.py
          # Do not waive/modify the existing Pillow 12.x release-policy bound in main.
          # The clean follow-up PR will separately review its 13.x policy change.
          sha256sum apps/api/requirements.lock
      - name: Emit public Pillow lockfile base64 chunks for reviewed handoff
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          b64 = base64.b64encode(Path('apps/api/requirements.lock').read_bytes()).decode()
          print('PILLOW_LOCK_B64_BEGIN')
          for i in range(0, len(b64), 1000):
              print('PILLOW_LOCK_B64_CHUNK:' + b64[i:i+1000])
          print('PILLOW_LOCK_B64_END')
          PY
      - name: Upload review-only Pillow hashed lock
        uses: actions/upload-artifact@v6
        with:
          name: verified-pillow13-lock-pr-${{ github.event.pull_request.number }}
          path: apps/api/requirements.lock
          if-no-files-found: error
          retention-days: 7
