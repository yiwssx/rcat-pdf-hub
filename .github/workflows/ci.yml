name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      PDFHUB_API_KEY_PEPPER: ci-test-pepper-change-me
      PDFHUB_ADMIN_API_KEY: pdfh_ci_admin_key_change_me
      PDFHUB_WEBHOOK_MASTER_SECRET: ci-webhook-master-secret-change-me
      PDFHUB_AUTH_TOKEN_SECRET: ci-auth-token-secret-change-me-0123456789abcdef
      PDFHUB_DATABASE_URL: "sqlite+pysqlite:///:memory:"
      PDFHUB_DATA_DIR: /tmp/pdfhub-ci-data
    steps:
      - name: Configure Git defaults
        working-directory: ${{ github.workspace }}
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies without warnings
        run: |
          set -o pipefail
          pip install -r requirements.txt 2>&1 | tee /tmp/pip-install.log
          if grep -Eqi '(^|[[:space:]])warning:|deprecated|deprecationwarning' /tmp/pip-install.log; then
            echo "Dependency installation emitted a warning" >&2
            exit 1
          fi
      - name: Validate backend dependency graph
        run: |
          pip check
          python -W error -c 'import ldap3, pyasn1'
      - run: python -m compileall -q app tests alembic
      - run: python -m pytest -q
      - name: Validate Alembic fresh database
        run: |
          rm -f /tmp/pdfhub-migrate-fresh.db
          PDFHUB_DATABASE_URL=sqlite+pysqlite:////tmp/pdfhub-migrate-fresh.db python -c 'from app.migrate import run_migrations; run_migrations()'
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          engine = create_engine("sqlite+pysqlite:////tmp/pdfhub-migrate-fresh.db")
          tables = set(inspect(engine).get_table_names())
          assert {"api_keys", "service_policies", "files", "jobs", "archive_records", "alembic_version"} <= tables
          with engine.connect() as conn:
              assert conn.execute(text("select version_num from alembic_version")).scalar() == "0002_phase3_archive_records"
          PY
      - name: Validate Phase 2 database adoption
        run: |
          rm -f /tmp/pdfhub-migrate-adopt.db
          PDFHUB_DATABASE_URL=sqlite+pysqlite:////tmp/pdfhub-migrate-adopt.db python - <<'PY'
          from app.db import engine
          from app.models import ApiKey, FileRecord, JobRecord, ServicePolicy
          for table in [ApiKey.__table__, ServicePolicy.__table__, FileRecord.__table__, JobRecord.__table__]:
              table.create(bind=engine, checkfirst=True)
          PY
          PDFHUB_DATABASE_URL=sqlite+pysqlite:////tmp/pdfhub-migrate-adopt.db python -c 'from app.migrate import run_migrations; run_migrations()'
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          engine = create_engine("sqlite+pysqlite:////tmp/pdfhub-migrate-adopt.db")
          tables = set(inspect(engine).get_table_names())
          assert "archive_records" in tables
          with engine.connect() as conn:
              assert conn.execute(text("select version_num from alembic_version")).scalar() == "0002_phase3_archive_records"
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Configure Git defaults
        working-directory: ${{ github.workspace }}
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install frontend dependencies without warnings
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee /tmp/npm-install.log
          if grep -Eqi 'npm warn|warning:|deprecated|deprecationwarning' /tmp/npm-install.log; then
            echo "Dependency installation emitted a warning" >&2
            exit 1
          fi
      - run: npm run typecheck
      - name: Build frontend without warnings
        run: |
          mkdir -p .next/cache
          set -o pipefail
          npm run build 2>&1 | tee /tmp/next-build.log
          if grep -Eqi '⚠|##\[warning\]|npm warn|warning:|deprecated|deprecationwarning' /tmp/next-build.log; then
            echo "Frontend build emitted a warning" >&2
            exit 1
          fi
          git diff --exit-code -- tsconfig.json

  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      PDFHUB_API_KEY_PEPPER: ci-test-pepper-change-me
      PDFHUB_ADMIN_API_KEY: pdfh_ci_admin_key_change_me
      PDFHUB_WEBHOOK_MASTER_SECRET: ci-webhook-master-secret-change-me
      PDFHUB_AUTH_TOKEN_SECRET: ci-auth-token-secret-change-me-0123456789abcdef
      PDFHUB_NAS_PATH: /tmp/pdfhub-nas
    steps:
      - name: Configure Git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false
      - uses: actions/checkout@v7
      - name: Validate Compose without warnings
        run: |
          docker compose config >/tmp/compose-config.out 2>/tmp/compose-config.err
          test ! -s /tmp/compose-config.err || { cat /tmp/compose-config.err >&2; exit 1; }
          docker compose --profile s3 --profile security --profile observability --profile archive config >/tmp/compose-all.out 2>/tmp/compose-all.err
          test ! -s /tmp/compose-all.err || { cat /tmp/compose-all.err >&2; exit 1; }
          docker compose -f docker-compose.yml -f docker-compose.nas.yml config >/tmp/compose-nas.out 2>/tmp/compose-nas.err
          test ! -s /tmp/compose-nas.err || { cat /tmp/compose-nas.err >&2; exit 1; }
