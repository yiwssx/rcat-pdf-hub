name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Configure Git defaults
        working-directory: ${{ github.workspace }}
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: python -m pytest -q
        env:
          PDFHUB_API_KEY_PEPPER: ci-test-pepper-change-me
          PDFHUB_ADMIN_API_KEY: pdfh_ci_admin_key_change_me
          PDFHUB_WEBHOOK_MASTER_SECRET: ci-webhook-master-secret-change-me
          PDFHUB_DATABASE_URL: "sqlite+pysqlite:///:memory:"
          PDFHUB_DATA_DIR: /tmp/pdfhub-ci-data

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Configure Git defaults
        working-directory: ${{ github.workspace }}
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false
      - uses: actions/checkout@v6
      - run: docker compose config >/dev/null
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          PDFHUB_API_KEY_PEPPER: ci-test-pepper-change-me
          PDFHUB_ADMIN_API_KEY: pdfh_ci_admin_key_change_me
          PDFHUB_WEBHOOK_MASTER_SECRET: ci-webhook-master-secret-change-me
