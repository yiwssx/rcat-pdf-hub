name: Runtime Acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      POSTGRES_DB: pdfhub
      POSTGRES_USER: pdfhub
      POSTGRES_PASSWORD: ci-runtime-postgres-password
      PDFHUB_API_KEY_PEPPER: ci-runtime-api-key-pepper-change-me
      PDFHUB_ADMIN_API_KEY: pdfh_ci_runtime_admin_key_change_me_1234567890
      PDFHUB_WEBHOOK_MASTER_SECRET: ci-runtime-webhook-master-secret-change-me
      PDFHUB_AUTH_TOKEN_SECRET: ci-runtime-auth-token-secret-change-me-0123456789abcdef
      PDFHUB_HTTP_PORT: "18080"
      PDFHUB_ALLOWED_ORIGINS: http://localhost:18080
      PDFHUB_PUBLIC_BASE_URL: http://localhost:18080
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Configure Git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false
      - uses: actions/checkout@v6

      - name: Pull core runtime dependencies without warnings
        run: |
          set -o pipefail
          docker compose pull postgres valkey gotenberg caddy 2>&1 | tee /tmp/runtime-pull.log
          if grep -Eqi '(^|[[:space:]])warn(ing)?([[:space:]:]|$)|deprecated|deprecationwarning|⚠|##\[warning\]' /tmp/runtime-pull.log; then
            echo "Runtime image pull emitted a warning" >&2
            exit 1
          fi

      - name: Build application images without warnings
        run: |
          set -o pipefail
          docker compose build --pull api worker cleanup web 2>&1 | tee /tmp/runtime-build.log
          if grep -Eqi '(^|[[:space:]])warn(ing)?([[:space:]:]|$)|deprecated|deprecationwarning|⚠|##\[warning\]' /tmp/runtime-build.log; then
            echo "Runtime image build emitted a warning" >&2
            exit 1
          fi

      - name: Configure runtime kernel requirements
        run: |
          sudo sysctl -q -w vm.overcommit_memory=1
          test "$(sysctl -n vm.overcommit_memory)" = "1"

      - name: Start warning-free core stack
        run: |
          set -o pipefail
          docker compose up -d --no-build --wait --wait-timeout 240 2>&1 | tee /tmp/runtime-up.log
          if grep -Eqi '(^|[[:space:]])warn(ing)?([[:space:]:]|$)|deprecated|deprecationwarning|⚠|##\[warning\]' /tmp/runtime-up.log; then
            echo "Runtime startup emitted a warning" >&2
            exit 1
          fi

      - name: Core end-to-end acceptance
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="http://localhost:${PDFHUB_HTTP_PORT}"
          printf '%s\n' api caddy cleanup gotenberg postgres valkey web worker | sort > /tmp/expected.txt
          docker compose ps --services --status running | sort > /tmp/running.txt
          diff -u /tmp/expected.txt /tmp/running.txt

          curl -fsS "${BASE_URL}/healthz" -o /tmp/health.json
          python3 - <<'PY'
          import json
          payload = json.load(open('/tmp/health.json'))
          assert payload == {"status":"ok","services":{"database":True,"redis":True}}, payload
          PY
          curl -fsS "${BASE_URL}/readyz" -o /tmp/ready.json
          curl -fsS "${BASE_URL}/api/v1/auth/config" -o /tmp/auth.json
          python3 - <<'PY'
          import json
          payload = json.load(open('/tmp/auth.json'))
          assert payload['api_key']['enabled'] is True
          PY

          docker compose exec -T api python - <<'PY'
          from reportlab.pdfgen import canvas
          pdf = canvas.Canvas('/tmp/runtime.pdf', pagesize=(595,842))
          pdf.drawString(72,760,'RCAT PDF Hub Phase 3 runtime')
          pdf.showPage(); pdf.save()
          PY
          docker compose cp api:/tmp/runtime.pdf /tmp/runtime.pdf >/dev/null
          curl -fsS -X POST "${BASE_URL}/api/v1/files" \
            -H "X-API-Key: ${PDFHUB_ADMIN_API_KEY}" \
            -F 'file=@/tmp/runtime.pdf;type=application/pdf' -o /tmp/upload.json
          FILE_ID="$(python3 -c 'import json; print(json.load(open("/tmp/upload.json"))["id"])')"
          printf '{"file_id":"%s","text":"ทดสอบ Phase 3","font_size":32,"opacity":0.2,"rotation":25,"position":"center","margin":24}' "$FILE_ID" >/tmp/job.json
          curl -fsS -X POST "${BASE_URL}/api/v1/pdf/watermark" \
            -H "X-API-Key: ${PDFHUB_ADMIN_API_KEY}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/job.json -o /tmp/job-out.json
          JOB_ID="$(python3 -c 'import json; print(json.load(open("/tmp/job-out.json"))["id"])')"
          for _ in $(seq 1 90); do
            curl -fsS "${BASE_URL}/api/v1/jobs/${JOB_ID}" -H "X-API-Key: ${PDFHUB_ADMIN_API_KEY}" -o /tmp/status.json
            STATUS="$(python3 -c 'import json; print(json.load(open("/tmp/status.json"))["status"])')"
            [ "$STATUS" = completed ] && break
            [ "$STATUS" = failed ] && { cat /tmp/status.json; exit 1; }
            sleep 2
          done
          test "$STATUS" = completed
          OUT="$(python3 -c 'import json; print(json.load(open("/tmp/status.json"))["output_file_id"])')"
          curl -fsS "${BASE_URL}/api/v1/files/${OUT}/preview?page=1&width=480" -H "X-API-Key: ${PDFHUB_ADMIN_API_KEY}" -o /tmp/preview.png
          curl -fsS "${BASE_URL}/api/v1/files/${OUT}/download" -H "X-API-Key: ${PDFHUB_ADMIN_API_KEY}" -o /tmp/output.pdf
          python3 - <<'PY'
          from pathlib import Path
          assert Path('/tmp/output.pdf').read_bytes().startswith(b'%PDF-')
          assert Path('/tmp/preview.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          PY
          docker compose exec -T api curl -fsS http://localhost:8000/metrics | grep -q '^pdfhub_http_requests_total'
          docker compose exec -T -e PGPASSWORD="${POSTGRES_PASSWORD}" postgres \
            psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc 'select version_num from alembic_version' \
            | grep -q '^0002_phase3_archive_records$'

      - name: Assert core runtime logs are clean
        run: |
          docker compose logs --no-color > /tmp/runtime-services.log 2>&1
          if grep -Ein '(^|[[:space:]])(warn|warning|error)([[:space:]:]|$)|level=(warn|warning|error)|deprecated|deprecationwarning|⚠|##\[warning\]' /tmp/runtime-services.log; then
            echo "Runtime services emitted a warning or error" >&2
            exit 1
          fi

      - name: Tear down core stack
        run: docker compose down -v --remove-orphans

      - name: Phase 3 S3 and ClamAV acceptance
        shell: bash
        run: |
          set -euo pipefail
          export PDFHUB_STORAGE_BACKEND=s3
          export PDFHUB_S3_ENDPOINT_URL=http://seaweedfs:8333
          export PDFHUB_S3_BUCKET=pdfhub-runtime
          export PDFHUB_S3_ACCESS_KEY=pdfhub-runtime-key
          export PDFHUB_S3_SECRET_KEY=pdfhub-runtime-secret-key
          export PDFHUB_S3_AUTO_CREATE_BUCKET=true
          export PDFHUB_CLAMAV_ENABLED=true
          export PDFHUB_CLAMAV_FAIL_CLOSED=true

          docker compose --profile s3 --profile security pull seaweedfs clamav
          docker compose --profile s3 --profile security up -d --no-build --wait --wait-timeout 360
          BASE_URL="http://localhost:${PDFHUB_HTTP_PORT}"
          ready=0
          for _ in $(seq 1 120); do
            if curl -fsS "${BASE_URL}/readyz" >/tmp/phase3-ready.json 2>/dev/null; then ready=1; break; fi
            sleep 3
          done
          test "$ready" = 1
          python3 - <<'PY'
          import json
          payload = json.load(open('/tmp/phase3-ready.json'))
          assert payload['services']['storage'] is True
          assert payload['services']['clamav'] is True
          PY

          curl -fsS -X POST "${BASE_URL}/api/v1/files" \
            -H "X-API-Key: ${PDFHUB_ADMIN_API_KEY}" \
            -F 'file=@/tmp/runtime.pdf;type=application/pdf' -o /tmp/s3-upload.json
          S3_FILE="$(python3 -c 'import json; print(json.load(open("/tmp/s3-upload.json"))["id"])')"
          curl -fsS "${BASE_URL}/api/v1/files/${S3_FILE}/download" -H "X-API-Key: ${PDFHUB_ADMIN_API_KEY}" -o /tmp/s3-download.pdf
          cmp /tmp/runtime.pdf /tmp/s3-download.pdf

          python3 - <<'PY'
          from pathlib import Path
          parts = ['X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-', 'STANDARD-ANTIVIRUS-TEST-FILE!$H+H*']
          Path('/tmp/eicar.txt').write_text(''.join(parts), encoding='ascii')
          PY
          HTTP_CODE="$(curl -sS -o /tmp/eicar-response.json -w '%{http_code}' -X POST "${BASE_URL}/api/v1/files" -H "X-API-Key: ${PDFHUB_ADMIN_API_KEY}" -F 'file=@/tmp/eicar.txt;type=text/plain')"
          test "$HTTP_CODE" = 422

      - name: Tear down Phase 3 stack
        if: always()
        run: docker compose --profile s3 --profile security --profile observability --profile archive down -v --remove-orphans

      - name: Runtime diagnostics on failure
        if: failure()
        run: |
          docker compose --profile s3 --profile security --profile observability --profile archive ps || true
          docker compose --profile s3 --profile security --profile observability --profile archive logs --no-color --tail=300 || true
