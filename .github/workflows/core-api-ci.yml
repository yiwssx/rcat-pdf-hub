name: Core API CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "docker-compose*.yml"
      - ".env.example"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/core-api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Validate repository release policy
        run: python3 scripts/validate-release-policy.py
      - name: Validate Python dependency lock
        run: python3 scripts/check-python-lock.py
      - name: Validate Compose configurations
        run: make validate-compose
      - name: Build API test image
        run: docker build -t rcat-pdf-hub-api-test apps/api
      - name: Exercise production network boundary
        run: |
          set -Eeuo pipefail
          export POSTGRES_DB=pdfhub
          export POSTGRES_USER=pdfhub
          export POSTGRES_PASSWORD=network-postgres-password
          export PDFHUB_API_KEY_PEPPER=network-api-key-pepper
          export PDFHUB_ADMIN_API_KEY=pdfh_network_admin_key_change_me_1234567890
          export PDFHUB_WEBHOOK_MASTER_SECRET=network-webhook-master-secret-change-me
          export PDFHUB_AUTH_TOKEN_SECRET=network-auth-token-secret-change-me-0123456789abcdef
          export PDFHUB_DOWNLOAD_SIGNING_SECRET=network-download-signing-secret-change-me-0123456789abcdef
          export PDFHUB_ALLOWED_ORIGINS=http://localhost:18083
          export PDFHUB_PUBLIC_BASE_URL=http://localhost:18083
          export PDFHUB_PUBLIC_BIND_HOST=127.0.0.1
          export PDFHUB_HTTP_PORT=18083
          export PDFHUB_SESSION_COOKIE_SECURE=false
          export PDFHUB_WEB_CONSOLE_AUTO_LOGIN=true
          export PDFHUB_NAS_PATH=/tmp/pdfhub-network-nas
          project="pdfhub-network-${GITHUB_RUN_ID}"
          dc() { docker compose -p "${project}" -f docker-compose.yml -f docker-compose.prod.yml "$@"; }
          cleanup() { dc down -v --remove-orphans >/dev/null 2>&1 || true; rm -rf "${PDFHUB_NAS_PATH}" || true; }
          trap cleanup EXIT
          dc build api worker cleanup webhook web
          dc up -d --no-build --wait --wait-timeout 240 postgres valkey gotenberg api
          dc exec -T api python -c 'from app.migrate import run_migrations; run_migrations()'
          dc up -d --no-build --wait --wait-timeout 240 worker cleanup webhook web caddy
          PDFHUB_COMPOSE_PROJECT="${project}" bash scripts/validate-container-hardening.sh
          dc --profile s3 --profile security --profile observability --profile archive config --format json >/tmp/pdfhub-network.json
          python3 scripts/check-production-network.py /tmp/pdfhub-network.json "${PDFHUB_PUBLIC_BIND_HOST}" "${PDFHUB_MANAGEMENT_BIND_HOST:-127.0.0.1}"
          curl -fsS "http://127.0.0.1:${PDFHUB_HTTP_PORT}/healthz" >/dev/null
      - name: Run API tests
        run: docker run --rm rcat-pdf-hub-api-test python -m pytest -q
