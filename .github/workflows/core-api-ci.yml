name: Core API CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "docker-compose*.yml"
      - ".env.example"
      - "scripts/**"
      - "ops/prometheus/**"
      - "ops/alertmanager/**"
      - "ops/otel/**"
      - "ops/tempo/**"
      - "ops/grafana/**"
      - "Makefile"
      - ".github/workflows/core-api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-python:
    name: Host tooling on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate host Python compatibility and operator scripts
        run: |
          python3 scripts/check-host-python.py
          make validate-ops

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Validate repository release policy
        run: python3 scripts/validate-release-policy.py
      - name: Validate Python dependency lock
        run: python3 scripts/check-python-lock.py
      - name: Validate Compose configurations
        run: make validate-compose
      - name: Validate Prometheus configuration
        run: make validate-observability
      - name: Build API test image
        run: docker build -t rcat-pdf-hub-api-test apps/api
      - name: Validate OpenAPI frontend contract
        run: docker run --rm -e PDFHUB_CONTRACT_ARTIFACT=/tmp/openapi.json -v "$PWD:/repo" -w /repo rcat-pdf-hub-api-test python scripts/validate-api-contract.py
      - name: Run API tests with backend coverage gate
        run: docker run --rm -e PDFHUB_COVERAGE_ARTIFACT=/tmp/backend-coverage.json -v "$PWD:/repo" -w /repo rcat-pdf-hub-api-test python scripts/backend-coverage.py
