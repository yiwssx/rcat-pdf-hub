name: Core API CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "docker-compose*.yml"
      - ".env.example"
      - "scripts/**"
      - "contracts/**"
      - "docs/workstreams/pdf-90-tools-master-tracker.md"
      - "ops/prometheus/**"
      - "ops/gotenberg/**"
      - "ops/alertmanager/**"
      - "ops/otel/**"
      - "ops/tempo/**"
      - "ops/grafana/**"
      - "Makefile"
      - ".github/workflows/core-api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-python:
    name: Host tooling on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate host Python compatibility and operator scripts
        run: |
          python3 scripts/check-host-python.py
          make validate-ops
          python3 -m unittest discover -s scripts/tests -p "test_office_font_bundle.py"
          python3 -m unittest discover -s scripts/tests -p "test_upload_dns_doctor.py"
          bash -n scripts/doctor-upload-dns.sh

  gotenberg-fonts:
    name: Build and check Thai Office converter image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned Gotenberg image with Thai fonts
        run: docker build -t rcat-pdf-hub-gotenberg-ci ops/gotenberg
      - name: Verify Thai font packages are installed in Gotenberg
        run: |
          docker run --rm --entrypoint fc-list rcat-pdf-hub-gotenberg-ci -f '%{family}\n' > /tmp/gotenberg-fonts.txt
          grep -Eiq '(^|, ?)(Garuda|Kinnari|Loma|Norasi|Purisa|Umpush|Waree)(,|$)' /tmp/gotenberg-fonts.txt
      - name: Verify converter starts unprivileged
        run: |
          test "$(docker run --rm --entrypoint id rcat-pdf-hub-gotenberg-ci -u)" = '1001'
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Match the production database major/minor for the T90 migration rehearsal.
        # GitHub Actions automatically removes this disposable service after CI.
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: pdfhub_t90_ci
          POSTGRES_PASSWORD: ci-t90-ephemeral-not-a-production-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdfhub_t90_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - name: Validate repository release policy
        run: python3 scripts/validate-release-policy.py
      - name: Validate Python dependency lock
        run: python3 scripts/check-python-lock.py
      - name: Validate Compose configurations
        run: make validate-compose
      - name: Validate Prometheus configuration
        run: make validate-observability
      - name: Build API test image
        run: docker build -t rcat-pdf-hub-api-test apps/api
      - name: Validate OpenAPI frontend contract
        run: docker run --rm -e PDFHUB_CONTRACT_ARTIFACT=/tmp/openapi.json -v "$PWD:/repo" -w /repo rcat-pdf-hub-api-test python scripts/validate-api-contract.py
      - name: Run API tests with backend coverage gate
        run: docker run --rm -e PDFHUB_COVERAGE_ARTIFACT=/tmp/backend-coverage.json -v "$PWD:/repo" -w /repo rcat-pdf-hub-api-test python scripts/backend-coverage.py
      - name: Rehearse T90 migrations against isolated PostgreSQL 18
        run: |
          docker run --rm --network host \
            -e GITHUB_ACTIONS=true \
            -e PDFHUB_T90_POSTGRES_TEST_URL="postgresql+psycopg://pdfhub_t90_ci:ci-t90-ephemeral-not-a-production-password@127.0.0.1:5432/postgres" \
            -w /app rcat-pdf-hub-api-test \
            python -m pytest -q -p no:cacheprovider tests/test_t90_postgres_migration_ci.py
      - name: Exercise real Valkey/RQ and self-hosted SeaweedFS crash scenarios
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # Disposable CI services; never use RCAT Production Redis or S3.
          docker run -d --name pdfhub-t90-valkey-ci \
            -p 127.0.0.1:6379:6379 valkey/valkey:8.1.9-alpine3.24 \
            valkey-server --save "" --appendonly no
          docker run -d --name pdfhub-t90-seaweedfs-ci \
            -p 127.0.0.1:8333:8333 \
            -e AWS_ACCESS_KEY_ID=t90ci \
            -e AWS_SECRET_ACCESS_KEY=t90ci-ephemeral-key \
            chrislusf/seaweedfs:4.44 \
            server -dir=/data -s3 -s3.port=8333 \
            -master.volumeSizeLimitMB=64 -volume.max=32
          cleanup() {
            if [ "${1:-0}" -ne 0 ]; then
              docker logs --tail 100 pdfhub-t90-seaweedfs-ci || true
              docker logs --tail 70 pdfhub-t90-valkey-ci || true
            fi
            docker rm -f pdfhub-t90-seaweedfs-ci pdfhub-t90-valkey-ci || true
          }
          trap 'cleanup "$?"' EXIT
          docker run --rm --network host \
            -e GITHUB_ACTIONS=true \
            -e PDFHUB_T90_STACK_ENABLED=yes \
            -e PDFHUB_T90_STACK_POSTGRES_ADMIN_URL="postgresql+psycopg://pdfhub_t90_ci:ci-t90-ephemeral-not-a-production-password@127.0.0.1:5432/postgres" \
            -e PDFHUB_T90_STACK_S3_ENDPOINT="http://127.0.0.1:8333" \
            -w /app rcat-pdf-hub-api-test \
            python tests/t90_stack_probe.py
      - name: Exercise full backend validation in the pinned image
        run: bash scripts/validate-free.sh backend
