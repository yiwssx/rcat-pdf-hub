name: pdf-hub

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdfhub}
      POSTGRES_USER: ${POSTGRES_USER:-pdfhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdfhub} -d ${POSTGRES_DB:-pdfhub}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.9-alpine3.24
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.34.0
    command:
      - gotenberg
      - --api-timeout=300s
      - --libreoffice-restart-after=20
      - --chromium-restart-after=50
    tmpfs:
      - /tmp:size=2g
    restart: unless-stopped

  api:
    build: ./apps/api
    environment: &api-env
      PDFHUB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pdfhub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pdfhub}
      PDFHUB_REDIS_URL: redis://valkey:6379/0
      PDFHUB_GOTENBERG_URL: http://gotenberg:3000
      PDFHUB_DATA_DIR: /data
      PDFHUB_MAX_UPLOAD_MB: ${PDFHUB_MAX_UPLOAD_MB:-100}
      PDFHUB_RETENTION_HOURS: ${PDFHUB_RETENTION_HOURS:-24}
      PDFHUB_CLEANUP_INTERVAL_SECONDS: ${PDFHUB_CLEANUP_INTERVAL_SECONDS:-900}
      PDFHUB_CLEANUP_TEMPORARY_HOURS: ${PDFHUB_CLEANUP_TEMPORARY_HOURS:-6}
      PDFHUB_PREVIEW_MAX_WIDTH: ${PDFHUB_PREVIEW_MAX_WIDTH:-1600}
      PDFHUB_PDF_TO_IMAGE_MAX_PAGES: ${PDFHUB_PDF_TO_IMAGE_MAX_PAGES:-200}
      PDFHUB_DEFAULT_RATE_LIMIT_PER_MINUTE: ${PDFHUB_DEFAULT_RATE_LIMIT_PER_MINUTE:-120}
      PDFHUB_DEFAULT_DAILY_JOB_LIMIT: ${PDFHUB_DEFAULT_DAILY_JOB_LIMIT:-1000}
      PDFHUB_DEFAULT_MAX_STORAGE_MB: ${PDFHUB_DEFAULT_MAX_STORAGE_MB:-2048}
      PDFHUB_WEBHOOK_ALLOWED_HOSTS: ${PDFHUB_WEBHOOK_ALLOWED_HOSTS:-}
      PDFHUB_WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${PDFHUB_WEBHOOK_ALLOW_PRIVATE_NETWORKS:-false}
      PDFHUB_WEBHOOK_MASTER_SECRET: ${PDFHUB_WEBHOOK_MASTER_SECRET:?set PDFHUB_WEBHOOK_MASTER_SECRET in .env}
      PDFHUB_WEBHOOK_TIMEOUT_SECONDS: ${PDFHUB_WEBHOOK_TIMEOUT_SECONDS:-10}
      PDFHUB_WEBHOOK_MAX_ATTEMPTS: ${PDFHUB_WEBHOOK_MAX_ATTEMPTS:-6}
      PDFHUB_WEBHOOK_RETRY_INITIAL_SECONDS: ${PDFHUB_WEBHOOK_RETRY_INITIAL_SECONDS:-5}
      PDFHUB_WEBHOOK_RETRY_MAX_SECONDS: ${PDFHUB_WEBHOOK_RETRY_MAX_SECONDS:-900}
      PDFHUB_WEBHOOK_DISPATCH_INTERVAL_SECONDS: ${PDFHUB_WEBHOOK_DISPATCH_INTERVAL_SECONDS:-2}
      PDFHUB_WEBHOOK_DISPATCH_BATCH_SIZE: ${PDFHUB_WEBHOOK_DISPATCH_BATCH_SIZE:-50}
      PDFHUB_API_KEY_PEPPER: ${PDFHUB_API_KEY_PEPPER:?set PDFHUB_API_KEY_PEPPER in .env}
      PDFHUB_ADMIN_API_KEY: ${PDFHUB_ADMIN_API_KEY:?set PDFHUB_ADMIN_API_KEY in .env}
      PDFHUB_ALLOWED_ORIGINS: ${PDFHUB_ALLOWED_ORIGINS:-http://localhost:8080}
      PDFHUB_PUBLIC_BASE_URL: ${PDFHUB_PUBLIC_BASE_URL:-http://localhost:8080}
      PDFHUB_DOWNLOAD_SIGNING_SECRET: ${PDFHUB_DOWNLOAD_SIGNING_SECRET:?set PDFHUB_DOWNLOAD_SIGNING_SECRET in .env}
      PDFHUB_SIGNED_DOWNLOAD_DEFAULT_TTL_SECONDS: ${PDFHUB_SIGNED_DOWNLOAD_DEFAULT_TTL_SECONDS:-300}
      PDFHUB_SIGNED_DOWNLOAD_MAX_TTL_SECONDS: ${PDFHUB_SIGNED_DOWNLOAD_MAX_TTL_SECONDS:-3600}
      PDFHUB_AUTH_TOKEN_SECRET: ${PDFHUB_AUTH_TOKEN_SECRET:?set PDFHUB_AUTH_TOKEN_SECRET in .env}
      PDFHUB_SESSION_COOKIE_SECURE: ${PDFHUB_SESSION_COOKIE_SECURE:-false}
      PDFHUB_SESSION_TTL_MINUTES: ${PDFHUB_SESSION_TTL_MINUTES:-480}
      PDFHUB_HUMAN_SCOPES: ${PDFHUB_HUMAN_SCOPES:-files:read,files:write,jobs:read,pdf:merge,pdf:split,pdf:rotate,pdf:compress,pdf:ocr,pdf:pdfa,pdf:convert,pdf:watermark,pdf:page-number,pdf:stamp,pdf:image-to-pdf,pdf:pdf-to-image,archive:paperless}
      PDFHUB_ADMIN_GROUPS: ${PDFHUB_ADMIN_GROUPS:-pdfhub-admins}
      PDFHUB_OIDC_ENABLED: ${PDFHUB_OIDC_ENABLED:-false}
      PDFHUB_OIDC_ISSUER: ${PDFHUB_OIDC_ISSUER:-}
      PDFHUB_OIDC_CLIENT_ID: ${PDFHUB_OIDC_CLIENT_ID:-}
      PDFHUB_OIDC_CLIENT_SECRET: ${PDFHUB_OIDC_CLIENT_SECRET:-}
      PDFHUB_OIDC_AUDIENCE: ${PDFHUB_OIDC_AUDIENCE:-}
      PDFHUB_OIDC_DISCOVERY_URL: ${PDFHUB_OIDC_DISCOVERY_URL:-}
      PDFHUB_OIDC_GROUP_CLAIM: ${PDFHUB_OIDC_GROUP_CLAIM:-groups}
      PDFHUB_LDAP_ENABLED: ${PDFHUB_LDAP_ENABLED:-false}
      PDFHUB_LDAP_URL: ${PDFHUB_LDAP_URL:-ldap://ldap:389}
      PDFHUB_LDAP_BASE_DN: ${PDFHUB_LDAP_BASE_DN:-}
      PDFHUB_LDAP_BIND_DN: ${PDFHUB_LDAP_BIND_DN:-}
      PDFHUB_LDAP_BIND_PASSWORD: ${PDFHUB_LDAP_BIND_PASSWORD:-}
      PDFHUB_LDAP_USER_FILTER: ${PDFHUB_LDAP_USER_FILTER:-(uid={username})}
      PDFHUB_LDAP_USER_DN_TEMPLATE: ${PDFHUB_LDAP_USER_DN_TEMPLATE:-}
      PDFHUB_LDAP_GROUP_BASE_DN: ${PDFHUB_LDAP_GROUP_BASE_DN:-}
      PDFHUB_LDAP_GROUP_FILTER: ${PDFHUB_LDAP_GROUP_FILTER:-(member={user_dn})}
      PDFHUB_STORAGE_BACKEND: ${PDFHUB_STORAGE_BACKEND:-local}
      PDFHUB_S3_ENDPOINT_URL: ${PDFHUB_S3_ENDPOINT_URL:-}
      PDFHUB_S3_REGION: ${PDFHUB_S3_REGION:-us-east-1}
      PDFHUB_S3_BUCKET: ${PDFHUB_S3_BUCKET:-pdfhub}
      PDFHUB_S3_ACCESS_KEY: ${PDFHUB_S3_ACCESS_KEY:-}
      PDFHUB_S3_SECRET_KEY: ${PDFHUB_S3_SECRET_KEY:-}
      PDFHUB_S3_PREFIX: ${PDFHUB_S3_PREFIX:-pdfhub}
      PDFHUB_S3_ADDRESSING_STYLE: ${PDFHUB_S3_ADDRESSING_STYLE:-path}
      PDFHUB_S3_AUTO_CREATE_BUCKET: ${PDFHUB_S3_AUTO_CREATE_BUCKET:-false}
      PDFHUB_S3_SERVER_SIDE_ENCRYPTION: ${PDFHUB_S3_SERVER_SIDE_ENCRYPTION:-}
      PDFHUB_CLAMAV_ENABLED: ${PDFHUB_CLAMAV_ENABLED:-false}
      PDFHUB_CLAMAV_HOST: ${PDFHUB_CLAMAV_HOST:-clamav}
      PDFHUB_CLAMAV_PORT: ${PDFHUB_CLAMAV_PORT:-3310}
      PDFHUB_CLAMAV_FAIL_CLOSED: ${PDFHUB_CLAMAV_FAIL_CLOSED:-true}
      PDFHUB_RQ_QUEUE: ${PDFHUB_RQ_QUEUE:-pdf}
      PDFHUB_RQ_JOB_TIMEOUT_SECONDS: ${PDFHUB_RQ_JOB_TIMEOUT_SECONDS:-1800}
      PDFHUB_PROMETHEUS_ENABLED: ${PDFHUB_PROMETHEUS_ENABLED:-true}
      PDFHUB_OTEL_ENDPOINT: ${PDFHUB_OTEL_ENDPOINT:-}
      PDFHUB_OTEL_SERVICE_NAME: ${PDFHUB_OTEL_SERVICE_NAME:-rcat-pdf-hub-api}
      PDFHUB_PAPERLESS_ENABLED: ${PDFHUB_PAPERLESS_ENABLED:-false}
      PDFHUB_PAPERLESS_URL: ${PDFHUB_PAPERLESS_URL:-http://paperless:8000}
      PDFHUB_PAPERLESS_TOKEN: ${PDFHUB_PAPERLESS_TOKEN:-}
      PDFHUB_PAPERLESS_AUTO_ARCHIVE: ${PDFHUB_PAPERLESS_AUTO_ARCHIVE:-false}
    volumes:
      - pdf_data:/data
      - ${PDFHUB_NAS_PATH:-./data/nas-placeholder}:/mnt/pdfhub-nas
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      gotenberg:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build: ./apps/api
    command: ["sh", "-c", "exec rq worker --url \"$$PDFHUB_REDIS_URL\" \"$$PDFHUB_RQ_QUEUE\""]
    environment: *api-env
    volumes:
      - pdf_data:/data
      - ${PDFHUB_NAS_PATH:-./data/nas-placeholder}:/mnt/pdfhub-nas
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      gotenberg:
        condition: service_started
    restart: unless-stopped

  cleanup:
    build: ./apps/api
    command: ["python", "-m", "app.cleanup_runner"]
    environment: *api-env
    volumes:
      - pdf_data:/data
      - ${PDFHUB_NAS_PATH:-./data/nas-placeholder}:/mnt/pdfhub-nas
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  webhook:
    build: ./apps/api
    command: ["python", "-m", "app.webhook_runner"]
    environment: *api-env
    volumes:
      - pdf_data:/data
      - ${PDFHUB_NAS_PATH:-./data/nas-placeholder}:/mnt/pdfhub-nas
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./apps/web
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine
    ports:
      - "${PDFHUB_HTTP_PORT:-8080}:80"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  # Optional self-hosted S3-compatible single-node target for development or small sites.
  # Production may point PDFHUB_S3_ENDPOINT_URL at another self-hosted endpoint such as Ceph RGW.
  seaweedfs:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:4.44
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${PDFHUB_S3_ACCESS_KEY:-pdfhub}
      AWS_SECRET_ACCESS_KEY: ${PDFHUB_S3_SECRET_KEY:-pdfhub-development-secret}
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

  clamav:
    profiles: ["security"]
    image: clamav/clamav:1.5.4
    volumes:
      - clamav_db:/var/lib/clamav
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.2
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PDFHUB_MANAGEMENT_BIND_HOST:-127.0.0.1}:${PDFHUB_PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${PDFHUB_MANAGEMENT_BIND_HOST:-127.0.0.1}:${PDFHUB_OTEL_GRPC_PORT:-4317}:4317"
      - "${PDFHUB_MANAGEMENT_BIND_HOST:-127.0.0.1}:${PDFHUB_OTEL_HTTP_PORT:-4318}:4318"
    restart: unless-stopped

  paperless-db:
    profiles: ["archive"]
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD:-paperless-development-password}
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    volumes:
      - paperless_db_data:/var/lib/postgresql
    restart: unless-stopped

  paperless:
    profiles: ["archive"]
    image: ghcr.io/paperless-ngx/paperless-ngx:3.0.5
    depends_on:
      - paperless-db
      - valkey
    environment:
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:-paperless-development-password}
      PAPERLESS_REDIS: redis://valkey:6379/1
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-replace-this-before-production}
      PAPERLESS_URL: ${PAPERLESS_URL:-http://localhost:8001}
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_export:/usr/src/paperless/export
      - paperless_consume:/usr/src/paperless/consume
    ports:
      - "${PDFHUB_MANAGEMENT_BIND_HOST:-127.0.0.1}:${PAPERLESS_HTTP_PORT:-8001}:8000"
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:
  pdf_data:
  seaweedfs_data:
  clamav_db:
  prometheus_data:
  paperless_db_data:
  paperless_data:
  paperless_media:
  paperless_export:
  paperless_consume:
